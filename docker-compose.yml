services:
  n8n:
    image: homertrakker-n8n-fixed
    build: .
    container_name: n8n_hometrakker
    restart: unless-stopped
    user: root
    ports:
      - "8080:8080"
      - "127.0.0.1:5678:5678"
    environment:
      - NODES_EXCLUDE=[]
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_UNSAFE_WORKFLOW_EXECUTE_COMMANDS=true
      # Keep the SQLite database bounded. The old setting retained every run forever.
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=1000
      # Successful runs do not need to retain full payloads; errors remain available for diagnosis.
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=false
      - N8N_ENFORCEMENT_FS_FILE_ACCESS=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_RESTRICT_FILE_ACCESS_TO=/data/HomerTrakker:/
      - TZ=America/New_York
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${WEBHOOK_URL}
    volumes:
      - ~/.n8n:/root/.n8n
      - /Users/benbirkhahn/HomerTrakker:/data/HomerTrakker
